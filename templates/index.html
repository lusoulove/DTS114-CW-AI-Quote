<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quote Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            color: #1f2937;
        }

        .container {
            width: min(860px, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            text-align: center;
        }

        .generated-image {
            width: min(720px, 100%);
            min-height: 240px;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 14px 36px rgba(31, 41, 55, 0.16);
        }

        .generated-image img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .image-error {
            display: none;
            padding: 44px 24px;
            color: #6b7280;
            line-height: 1.5;
        }

        .quote-box {
            width: min(720px, 100%);
            background: #ffffff;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 8px 22px rgba(31, 41, 55, 0.1);
        }

        #quote-text {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            line-height: 1.6;
            font-style: italic;
        }

        #fetch-quote {
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="generated-image">
            <img
                id="generated-image"
                src="/generated-image"
                alt="Generated Image"
            >
            <p id="image-error" class="image-error">The generated image could not be loaded. Please refresh the page.</p>
        </section>

        <section class="quote-box">
            <p id="quote-text">Click the button to get an inspirational quote.</p>
        </section>

        <button id="fetch-quote" type="button">Get Quote</button>
    </main>

    <script>
        const quoteText = document.getElementById("quote-text");
        const fetchButton = document.getElementById("fetch-quote");
        const generatedImage = document.getElementById("generated-image");
        const imageError = document.getElementById("image-error");

        generatedImage.src = "/generated-image?seed=" + Date.now();

        generatedImage.addEventListener("error", () => {
            generatedImage.style.display = "none";
            imageError.style.display = "block";
        });

        fetchButton.addEventListener("click", async () => {
            fetchButton.disabled = true;
            quoteText.textContent = "Loading...";

            try {
                const response = await fetch("/api/quote");
                const data = await response.json();
                quoteText.textContent = data.quote || "No quote returned.";
            } catch (error) {
                quoteText.textContent = "Failed to fetch quote. Please try again.";
            } finally {
                fetchButton.disabled = false;
            }
        });
    </script>
</body>
</html>
